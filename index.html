<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>Snake Game</h1>

    <div class="score" aria-live="polite">Score: <span id="score">0</span></div>
    <canvas id="game-board" width="400" height="400" aria-label="Snake game board"></canvas>

    <p id="game-message" class="message" aria-live="polite">Use the arrow keys to move.</p>
    <button id="restart-button" type="button">Restart Game</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
